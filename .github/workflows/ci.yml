name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: codelab_tdd
          MYSQL_USER: codelab
          MYSQL_PASSWORD: codelab123
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Criar arquivo .env
        run: |
          echo "SESSION_SECRET=ci_secret_key" >> .env
          echo "DB_NAME=codelab_tdd" >> .env
          echo "DB_USER=codelab" >> .env
          echo "DB_PASSWORD=codelab123" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "PORT=3001" >> .env

      - name: Executar testes unitários e de integração
        run: npm run test:run

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npx playwright test

      - name: Upload relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
